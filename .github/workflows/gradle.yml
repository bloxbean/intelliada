# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        # ADR-005 L37: CI cannot resolve the JOUST checker kit (a local SNAPSHOT until a release), so it builds a
        # plugin without the checker, which refuses to sign or export. release.yml stays strict.
        run: ./gradlew buildPlugin -Pjoust.checkerOptional=true
